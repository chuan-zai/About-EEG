[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-transfer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "mne>=1.6", "scipy>=1.11", "scikit-learn>=1.4"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["eeg_transfer*"]

[tool.setuptools.package-data]
eeg_transfer = ["web/*.html", "web/*.css", "web/*.js"]
